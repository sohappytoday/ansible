# RHEL / Rocky Container Runtime 정리
- name: Check container runtime packages
  shell: "rpm -qa | grep -E 'docker|containerd|cri-o|runc' || true"
  register: runtime_packages
  changed_when: false

- name: Show warning if container runtime exists
  pause:
    prompt: |
      이미 설치된 Container Runtime이 있습니다.

      {{ runtime_packages.stdout }}

      이 Container Runtime을 이미 사용하고 있는 컨테이너가 있다면
      Docker 설치/재시작 과정에서 장애가 발생할 수 있습니다.

      계속 진행하시겠습니까? (yes/no)
  register: continue_answer
  when: runtime_packages.stdout != ""

- name: Stop if user does not agree
  fail:
    msg: "Docker 설치를 중단하겠습니다."
  when:
    - runtime_packages.stdout | default('') != ""
    - continue_answer.user_input | lower not in ["yes", "y"]

- name: Remove container runtime packages
  dnf:
    name:
      - docker
      - docker-client
      - docker-client-latest
      - docker-common
      - docker-latest
      - docker-latest-logrotate
      - docker-logrotate
      - docker-engine
      - podman
      - runc
      - containerd
      - containerd.io
    state: absent
    skip_broken: true
  when: runtime_packages.stdout | default('') != ""

  