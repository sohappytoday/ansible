---
# install_kubernetes 기본 변수
# inventory/ha-cluster-ssm.yml vars 섹션에서 오버라이드

# 노드 구성
install_kubernetes_cp_count: 1       # 1(단순) 또는 3 이상 홀수(HA)
install_kubernetes_worker_count: 2

# K8s 버전 (1.24 이상, 마이너 버전 지정) — pkgs.k8s.io 저장소 스트림 결정
install_kubernetes_version: "1.30"
# 패키지 패치 버전 고정 (선택). 비우면 스트림 최신
#   apt 예 "1.30.5-1.1" / dnf 예 "1.30.5"
install_kubernetes_k8s_patch_version: ""

# Container Runtime: containerd | crio | docker
install_kubernetes_cri_type: "containerd"

# CRI 버전 — 종류별로 분리, 모두 비우면 최신/기본 스트림 설치
#  containerd: 패키지 버전 (apt 예 "1.7.22-1" / dnf 예 "1.7.22-3.1.el9")
install_kubernetes_containerd_version: ""
#  CRI-O: crio_stream = 저장소 마이너 스트림 (비우면 'v' + k8s_version)
#         crio_version = 패키지 패치 버전 고정 (선택, 예 "1.30.5")
install_kubernetes_crio_stream: ""
install_kubernetes_crio_version: ""
#  Docker: Docker Engine 버전 + cri-dockerd 버전 (2개 분리)
install_kubernetes_docker_version: ""        # 예 "5:27.3.1-1~ubuntu.24.04~noble"
install_kubernetes_cri_dockerd_version: ""   # 예 "0.4.3" (비우면 GitHub 최신)

# CNI: calico | flannel | cilium
install_kubernetes_cni_type: "calico"
install_kubernetes_pod_cidr: ""      # 비우면 CNI별 기본값 자동 적용
install_kubernetes_service_cidr: "10.96.0.0/12"
# CNI 버전 (비우면 최신)
install_kubernetes_calico_version: ""   # 예 "v3.29.0" (비우면 GitHub 최신)
install_kubernetes_flannel_version: ""  # 예 "v0.26.0" (비우면 latest)
install_kubernetes_cilium_version: ""   # 예 "1.16.5" (비우면 최신 차트)

# HA apiserver 단일 엔드포인트
# 우선순위: control_plane_endpoint(외부 LB) > vip(keepalived). 둘 중 하나만 쓴다.
#   - AWS 등 클라우드: 내부 NLB의 DNS 이름을 control_plane_endpoint로 지정(권장).
#     keepalived/HAProxy(lb.yml)는 사용하지 않는다.
#   - 온프렘: vip + loadbalancers 그룹으로 keepalived/HAProxy 사용.
# inventory/ha-cluster-ssm.yml(generate-cluster-hosts.sh가 생성)에서 자동 주입됨.
install_kubernetes_control_plane_endpoint: ""
install_kubernetes_vip: ""           # cp_count >= 3 + 온프렘 keepalived 사용 시 설정
install_kubernetes_apiserver_port: 6443         # apiserver / 엔드포인트 포트
install_kubernetes_keepalived_vrid: 51          # VRRP virtual_router_id (서브넷 내 고유)
install_kubernetes_keepalived_auth_pass: "k8svip42"  # VRRP 인증 암호

# Ingress Controller (ingress-nginx) — 외부 Reverse Proxy가 NodePort로 포워딩
# Reverse Proxy(Public)가 worker의 이 NodePort(http)로 트래픽을 보낸다. Terraform의
# ingress_nodeport(기본 30080)와 반드시 일치해야 한다.
install_kubernetes_install_ingress: true
install_kubernetes_ingress_nodeport: 30080
# ingress-nginx 버전 — K8s 버전과 호환되는 릴리스를 지정할 것.
# (호환표: https://github.com/kubernetes/ingress-nginx#supported-versions-table)
install_kubernetes_ingress_nginx_version: "v1.12.1"

# 오프라인(폐쇄망) worker 설치
# worker가 인터넷 아웃바운드 차단 환경일 때 true. CP에서 .deb/이미지를 받아 worker로 복사 설치.
# 전제: CP와 worker가 동일 OS/아키텍처 (Ubuntu 24.04 / amd64 등)
install_kubernetes_offline_worker: false
# CP 임시 디렉토리 (worker용 .deb / 이미지 tar 보관)
install_kubernetes_offline_cp_deb_dir: /tmp/k8s-worker-debs
install_kubernetes_offline_cp_img_tar: /tmp/k8s-worker-images.tar
# 제어 노드 경유 임시 디렉토리 (fetch → copy 중계)
install_kubernetes_offline_local_dir: /tmp/k8s-offline
# worker 임시 디렉토리
install_kubernetes_offline_worker_deb_dir: /tmp/k8s-worker-debs
install_kubernetes_offline_worker_img_tar: /tmp/k8s-worker-images.tar
