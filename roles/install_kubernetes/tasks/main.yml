---
# install_kubernetes — 진입점
# conventions.md의 분기 패턴을 따른다.
#
# 노드 역할별 설치 경로:
#   - control_plane / worker(온라인): 인터넷으로 직접 설치 (cri-*, install)
#   - worker(offline_worker=true): CP에서 .deb/이미지를 받아 오프라인 설치
#
# 실행 순서 주의:
#   - LB(VIP)는 control-plane-init 보다 먼저 떠야 한다.
#   - 폐쇄망 worker는 CNI 설치 후 CP에서 이미지를 export → import 한 뒤 join 한다.

- name: Check OS family
  assert:
    that:
      - ansible_os_family in ["Debian", "RedHat"]
    fail_msg: "지원하지 않는 OS: {{ ansible_os_family }}"

# 편의 변수: 이 호스트가 오프라인 설치 대상 worker 인가
- name: Set offline worker flag for this host
  set_fact:
    is_offline_worker: "{{ install_kubernetes_offline_worker | bool and inventory_hostname in (groups['worker_nodes'] | default([])) }}"
    is_loadbalancer: "{{ inventory_hostname in (groups['loadbalancers'] | default([])) }}"

# === 1. 사전 준비 (K8s 노드 전체, LB 제외) — 인터넷 불필요 ===
- import_tasks: prerequisites.yml
  when: not is_loadbalancer

# === 2. CRI 설치 — CP(및 온라인 worker)만 인터넷 설치, 오프라인 worker는 스킵 ===
- import_tasks: cri-containerd.yml
  when:
    - install_kubernetes_cri_type == "containerd"
    - not is_loadbalancer
    - not is_offline_worker

- import_tasks: cri-crio.yml
  when:
    - install_kubernetes_cri_type == "crio"
    - not is_loadbalancer
    - not is_offline_worker

- import_tasks: cri-docker.yml
  when:
    - install_kubernetes_cri_type == "docker"
    - not is_loadbalancer
    - not is_offline_worker

# === 3. kubeadm/kubelet/kubectl 설치 — CP(및 온라인 worker)만 ===
- import_tasks: install.yml
  when:
    - not is_loadbalancer
    - not is_offline_worker

# === 4. 폐쇄망 worker: CP에서 .deb 준비 → worker 오프라인 설치 ===
- import_tasks: offline-prepare-packages.yml
  when:
    - install_kubernetes_offline_worker | bool
    - inventory_hostname == groups['control_plane'][0]
    - (groups['worker_nodes'] | default([])) | length > 0

- import_tasks: offline-install-packages.yml
  when: is_offline_worker

# === 5. HA: LB(VIP) 를 먼저 구성 ===
- import_tasks: lb.yml
  when:
    - install_kubernetes_cp_count | int >= 3
    - is_loadbalancer

# === 6. Control Plane 초기화 (첫 번째 CP) ===
- import_tasks: control-plane-init.yml
  when: inventory_hostname == groups['control_plane'][0]

# === 7. 나머지 CP join (HA) ===
- import_tasks: control-plane-join.yml
  when:
    - install_kubernetes_cp_count | int >= 3
    - inventory_hostname in groups['control_plane']
    - inventory_hostname != groups['control_plane'][0]

# === 8. CNI 설치 (첫 번째 CP) → CP에 CNI 이미지 캐시 ===
- import_tasks: cni-calico.yml
  when:
    - install_kubernetes_cni_type == "calico"
    - inventory_hostname == groups['control_plane'][0]

- import_tasks: cni-flannel.yml
  when:
    - install_kubernetes_cni_type == "flannel"
    - inventory_hostname == groups['control_plane'][0]

- import_tasks: cni-cilium.yml
  when:
    - install_kubernetes_cni_type == "cilium"
    - inventory_hostname == groups['control_plane'][0]

# === 9. 폐쇄망 worker: CP에서 이미지 export → worker import (join 전) ===
- import_tasks: offline-prepare-images.yml
  when:
    - install_kubernetes_offline_worker | bool
    - inventory_hostname == groups['control_plane'][0]
    - (groups['worker_nodes'] | default([])) | length > 0

- import_tasks: offline-install-images.yml
  when: is_offline_worker

# === 10. Worker 노드 join (패키지·이미지 준비 완료 후) ===
- import_tasks: worker-join.yml
  when: inventory_hostname in (groups['worker_nodes'] | default([]))
