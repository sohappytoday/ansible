- name: Get Server Spec
  hosts: all
  become: false
  roles:
    - server_spec

  post_tasks:
    - name: Set collected time
      set_fact:
        collected_time: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"
      delegate_to: localhost
      delegate_facts: true
      run_once: true

    - name: Create output directory for each host
      file:
        path: "./output/json"
        state: directory
      delegate_to: localhost

    - name: Save server info as JSON
      copy:
        content: "{{ server_info | to_nice_json }}"
        dest: "./output/json/{{ inventory_hostname }}_{{ hostvars['localhost']['collected_time'] }}.json"
      delegate_to: localhost

- name: Generate Server Spec Excel
  hosts: localhost
  gather_facts: false
  roles:
    - server_spec_excel
